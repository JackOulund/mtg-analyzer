[project]
name = "mtg-analyzer"
version = "0.1.0"
description = "Ingest YouTube Magic: The Gathering Commander games and generate a structured game analysis with Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16.5",
    "anthropic>=0.96.0",
    "apify-client>=1.12.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "greenlet>=3.2.5",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.39.0",
]
